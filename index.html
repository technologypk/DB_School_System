  .scrollbar-thin::-webkit-scrollbar { width:6px; }

  .scrollbar-thin::-webkit-scrollbar-track { background:transparent; }

  .fade-in { animation: fadeIn .35s ease both; }
  @keyframes fadeIn { from{opacity:0; transform:translateY(8px)} to{opacity:1; transform:none} }

  .pop-in { animation: popIn .22s cubic-bezier(.34,1.56,.64,1) both; }
  @keyframes popIn { from{opacity:0; transform:scale(.94) translateY(10px)} to{opacity:1; transform:none} }

  .badge { display:inline-flex; align-items:center; gap:.25rem; padding:.15rem .55rem; border-radius:999px; font-size:.6875rem; font-weight:600; line-height:1.5; }

  .swal2-popup { font-family:'Sarabun',sans-serif !important; border-radius:1.25rem !important; }
  .swal2-title { font-weight:700 !important; }

  .no-scroll { overflow:hidden; }

  /* ===== Drag & Drop styles ===== */
  .system-card.dragging {
    opacity: .35;
    transform: scale(.97) rotate(.5deg);
    cursor: grabbing !important;

  .system-card.drag-over {
    border-color: #35B4B0 !important;

    transform: translateY(-3px);
  }
  .system-card .drag-grip {
    cursor: grab;
  }
  .system-card .drag-grip:active {
    cursor: grabbing;

function loadLocal() {
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (!raw) return defaultData();
    const parsed = JSON.parse(raw);
    const base = defaultData();
    return {
      logo: parsed.logo || '',
      groups: base.groups.map((bg) => {
        const fg = (parsed.groups || []).find(g => g.id === bg.id);
        return fg ? { ...bg, systems: Array.isArray(fg.systems) ? fg.systems : [] } : bg;
      }),
      credentials: Array.isArray(parsed.credentials) ? parsed.credentials : []
    };
  } catch (e) {
    return defaultData();
  }
}

async function syncFromCloud() {
  if (!GAS_API_URL) return;
  try {
    const res = await fetch(GAS_API_URL + "?action=getData");
    const data = await res.json();
    if (data && data.groups) {
      DB = data;
      localStorage.setItem(LS_KEY, JSON.stringify(DB));
      renderLogo();
      renderMenu();
      if (currentView.type === 'home') renderHome();
      else if (currentView.type === 'group') renderGroup(currentView.id);
      else if (currentView.type === 'credentials') renderCredentials();
    }
  } catch (err) {
    console.warn("Cloud sync error, falling back to local storage:", err);
  }
}

async function save() {
  try {
    localStorage.setItem(LS_KEY, JSON.stringify(DB));
    if (GAS_API_URL) {
      fetch(GAS_API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain' },
        body: JSON.stringify({ action: 'saveData', data: DB })
      }).catch(err => console.error("Cloud save failed:", err));
    }
    return true;
  } catch (e) {
    Swal.fire({
      icon: 'error',
      title: 'บันทึกไม่สำเร็จ',
      text: 'พื้นที่จัดเก็บข้อมูลในเบราว์เซอร์เต็ม',
      confirmButtonColor: '#0C7C82'
    });
    return false;
  }
}

async function uploadFileToDrive(fileObj) {
  if (!GAS_API_URL) return fileObj;
  try {
    const response = await fetch(GAS_API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify({
        action: 'uploadFile',
        fileName: fileObj.name,
        fileType: fileObj.type,
        base64Data: fileObj.data
      })
    });
    const result = await response.json();
    if (result.status === 'success') {
      return {
        data: result.fileUrl,
        name: fileObj.name,
        type: fileObj.type,
        size: fileObj.size,
        fileId: result.fileId
      };
    }
  } catch (err) {
    console.error("Drive upload failed, using local format:", err);
  }
  return fileObj;
}

function initCanvas() {
  const cv = document.getElementById('heroCanvas');
  if (!cv) return;
  const ctx = cv.getContext('2d');
  let w = 0, h = 0, dots = [];

  function resize() {
    const rect = cv.parentElement.getBoundingClientRect();
    w = cv.width = Math.max(1, rect.width);
    h = cv.height = Math.max(1, rect.height);
    dots = Array.from({ length: 36 }, () => ({
      x: Math.random() * w, y: Math.random() * h,
      r: Math.random() * 2.4 + 0.8,
      vx: (Math.random() - 0.5) * 0.35,
      vy: (Math.random() - 0.5) * 0.35
    }));
  }

  if (canvasResizeHandler) window.removeEventListener('resize', canvasResizeHandler);
  canvasResizeHandler = resize;
  window.addEventListener('resize', canvasResizeHandler);
  resize();

  if (canvasRAF) cancelAnimationFrame(canvasRAF);

  function loop() {
    ctx.clearRect(0, 0, w, h);
    for (let i = 0; i < dots.length; i++) {
      const p = dots[i];
      p.x += p.vx; p.y += p.vy;
      if (p.x < 0 || p.x > w) p.vx *= -1;
      if (p.y < 0 || p.y > h) p.vy *= -1;

      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255,255,255,0.45)';
      ctx.fill();

      for (let j = i + 1; j < dots.length; j++) {
        const q = dots[j];
        const dx = p.x - q.x, dy = p.y - q.y;
        const d = Math.sqrt(dx * dx + dy * dy);
        if (d < 110) {
          ctx.beginPath();
          ctx.moveTo(p.x, p.y);
          ctx.lineTo(q.x, q.y);
          ctx.strokeStyle = `rgba(255,255,255,${0.13 * (1 - d / 110)})`;
          ctx.lineWidth = 1;
          ctx.stroke();
        }
      }
    }
    canvasRAF = requestAnimationFrame(loop);
  }
  loop();
}

/* =========================================================
   🔀 DRAG & DROP + REORDER SYSTEM
========================================================= */
const dragState = { el: null, gid: null, sid: null, ignoreClick: false };

function initSystemDragDrop() {
  const grid = document.getElementById('systemsGrid');
  if (!grid) return;

  grid.querySelectorAll('.system-card[draggable="true"]').forEach(card => {
    card.addEventListener('dragstart', handleCardDragStart);
    card.addEventListener('dragover',  handleCardDragOver);
    card.addEventListener('dragenter', handleCardDragEnter);
    card.addEventListener('dragleave', handleCardDragLeave);
    card.addEventListener('drop',      handleCardDrop);
    card.addEventListener('dragend',   handleCardDragEnd);
  });
}

function handleCardDragStart(e) {
  // ป้องกันการลากจากปุ่ม/ลิงก์/input ภายใน
  if (e.target.closest('button, a, input, select, textarea')) {
    e.preventDefault();
    return false;
  }
  dragState.el = this;
  dragState.gid = this.dataset.gid;
  dragState.sid = this.dataset.sid;
  dragState.ignoreClick = true;

  this.classList.add('dragging');
  e.dataTransfer.effectAllowed = 'move';
  e.dataTransfer.setData('text/plain', this.dataset.sid);
  try { e.dataTransfer.setData('application/x-bmk-sid', this.dataset.sid); } catch (_) {}
}

function handleCardDragOver(e) {
  if (!dragState.el || this === dragState.el) return;
  if (this.dataset.gid !== dragState.gid) return;
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
}

function handleCardDragEnter(e) {
  if (!dragState.el || this === dragState.el) return;
  if (this.dataset.gid !== dragState.gid) return;
  e.preventDefault();
  this.classList.add('drag-over');
}

function handleCardDragLeave() {
  this.classList.remove('drag-over');
}

async function handleCardDrop(e) {
  e.preventDefault();
  e.stopPropagation();
  this.classList.remove('drag-over');

  if (!dragState.el || this === dragState.el) return false;
  if (this.dataset.gid !== dragState.gid) return false;

  const srcSid = dragState.sid;
  const tgtSid = this.dataset.sid;
  const gid    = dragState.gid;

  if (srcSid === tgtSid) return false;

  // เคลียร์คลาสทันที
  document.querySelectorAll('.system-card').forEach(c => c.classList.remove('dragging', 'drag-over'));

  await moveSystemToPosition(gid, srcSid, tgtSid);
  return false;
}

function handleCardDragEnd() {
  document.querySelectorAll('.system-card').forEach(c => {
    c.classList.remove('dragging', 'drag-over');
  });
  setTimeout(() => { dragState.ignoreClick = false; }, 180);
  dragState.el = null;
}

function onSystemCardClick(event, gid, sid) {
  // ถ้าเพิ่งลากเสร็จ ให้ข้ามการคลิกครั้งนั้น
  if (dragState.ignoreClick) {
    event.preventDefault();
    event.stopPropagation();
    return;
  }
  openSystem(gid, sid);
}

/** ย้าย srcId ไปวางที่ตำแหน่งของ tgtId (insert) */
async function moveSystemToPosition(gid, srcId, tgtId) {
  const g = DB.groups.find(x => x.id === gid);
  if (!g) return;
  const srcIdx = g.systems.findIndex(s => s.id === srcId);
  const tgtIdx = g.systems.findIndex(s => s.id === tgtId);
  if (srcIdx < 0 || tgtIdx < 0 || srcIdx === tgtIdx) return;

  const [item] = g.systems.splice(srcIdx, 1);
  g.systems.splice(tgtIdx, 0, item);

  if (!(await save())) return;
  renderMenu();
  renderGroup(gid);
  toast('success', 'จัดเรียงลำดับเรียบร้อย');
}

/** เลื่อนขึ้น/ลงทีละ 1 ตำแหน่ง */
async function moveSystem(gid, sid, delta) {
  const g = DB.groups.find(x => x.id === gid);
  if (!g) return;
  const idx = g.systems.findIndex(s => s.id === sid);
  if (idx < 0) return;
  const newIdx = idx + delta;
  if (newIdx < 0 || newIdx >= g.systems.length) return;

  const [item] = g.systems.splice(idx, 1);
  g.systems.splice(newIdx, 0, item);

  if (!(await save())) return;
  renderMenu();
  renderGroup(gid);
}

function openModal(opts) {
  document.getElementById('modalTitle').textContent = opts.title || '';
  document.getElementById('modalBody').innerHTML = opts.body || '';
  const footer = document.getElementById('modalFooter');

  footer.innerHTML = `
    <button onclick="closeModal()" class="px-4 py-2.5 rounded-xl text-[13px] font-semibold text-slate-600 bg-white border border-slate-200 hover:bg-slate-100 transition">
      ยกเลิก
    </button>
    <button id="modalSubmit"
      class="px-5 py-2.5 rounded-xl text-[13px] font-semibold text-white bg-gradient-to-r from-[#0C7C82] to-[#35B4B0] shadow-lg shadow-primary/25 hover:-translate-y-0.5 active:scale-95 transition flex items-center gap-2">
      ${opts.submitText || 'บันทึก'}
    </button>`;

  modalHandler = opts.onSubmit;

  const btn = document.getElementById('modalSubmit');
  btn.onclick = async () => {
    if (!modalHandler) return closeModal();
    const original = btn.innerHTML;
    btn.disabled = true;
    btn.innerHTML = `${SPIN}<span>กำลังบันทึก...</span>`;
    try {
      const res = await modalHandler();
      if (res !== false) closeModal();
    } catch (e) {
      console.error(e);
    } finally {
      btn.disabled = false;
      btn.innerHTML = original;
    }
  };

  document.getElementById('modal').classList.remove('hidden');
  document.body.classList.add('no-scroll');

  setTimeout(() => {
    const first = document.querySelector('#modalBody input, #modalBody select, #modalBody textarea');
    if (first) first.focus();
  }, 120);

  const body = document.getElementById('modalBody');
  body.onkeydown = e => {
    if (e.key === 'Enter' && e.target.tagName === 'INPUT') {
      e.preventDefault();
      btn.click();
    }
  };
}

function closeModal() {
  document.getElementById('modal').classList.add('hidden');
  document.body.classList.remove('no-scroll');
  modalHandler = null;
  tempUpload = null;
}

function renderFilePreview(file) {
  const isImg = file.type && file.type.startsWith('image');
  const isDriveUrl = file.data && file.data.includes('drive.google.com');
  return `
    <div class="flex items-center gap-3 text-left">
      <div class="w-14 h-14 rounded-xl overflow-hidden bg-slate-100 flex items-center justify-center shrink-0 border border-slate-200">
        ${isImg
          ? `<img src="${file.data}" class="w-full h-full object-cover" loading="lazy">`
          : `<span class="text-darkred">${icon('doc', 'w-6 h-6')}</span>`}
      </div>
      <div class="min-w-0 flex-1">
        <p class="text-[12.5px] font-semibold text-slate-700 truncate">${esc(file.name || 'ไฟล์แนบ')}</p>
        <p class="text-[11px] text-slate-400 mt-0.5">${isImg ? 'รูปภาพ' : 'เอกสาร PDF'} ${file.size ? '• ' + (file.size / 1024).toFixed(0) + ' KB' : ''}</p>
        <span class="badge bg-lime2/20 text-[#5a8a2c] mt-1">${icon('check', 'w-3 h-3')} ${isDriveUrl ? 'จัดเก็บใน Google Drive' : 'แนบแล้ว'}</span>
      </div>
    </div>`;
}

function handleCredFile(e) {
  const f = e.target.files[0];
  if (!f) return;

  const ok = ['application/pdf', 'image/png', 'image/jpeg', 'image/jpg'];
  if (!ok.includes(f.type)) {
    Swal.fire({ icon: 'error', title: 'ไฟล์ไม่ถูกต้อง', text: 'รองรับเฉพาะ PDF, JPG, PNG', confirmButtonColor: '#0C7C82' });
    e.target.value = '';
    return;
  }
  if (f.size > 15 * 1024 * 1024) {
    Swal.fire({ icon: 'error', title: 'ไฟล์ใหญ่เกินไป', text: 'กรุณาเลือกไฟล์ขนาดไม่เกิน 15 MB', confirmButtonColor: '#0C7C82' });
    e.target.value = '';
    return;
  }

  const reader = new FileReader();
  const prev = document.getElementById('filePreview');
  prev.innerHTML = `<div class="flex items-center justify-center gap-2 text-primary py-2">${SPIN}<span class="text-[12.5px]">กำลังเตรียมไฟล์...</span></div>`;

  reader.onload = ev => {
    tempUpload = { data: ev.target.result, name: f.name, type: f.type, size: f.size };
    document.getElementById('filePreview').innerHTML = renderFilePreview(tempUpload);
    document.getElementById('removeFileBtn').classList.remove('hidden');
    toast('success', 'แนบไฟล์เรียบร้อย');
  };
  reader.readAsDataURL(f);
}

function clearTempFile() {
  tempUpload = null;
  const input = document.getElementById('c_file');
  if (input) input.value = '';
  document.getElementById('filePreview').innerHTML = `
    <div class="flex flex-col items-center gap-1.5 text-slate-400 pointer-events-none">
      <div class="w-11 h-11 rounded-xl bg-slate-100 flex items-center justify-center">
        ${icon('doc', 'w-5 h-5')}
      </div>
      <p class="text-[12.5px] font-medium text-slate-500">คลิกเพื่อเลือกไฟล์</p>
      <p class="text-[11px]">รองรับ PDF, JPG, PNG (ส่งตรงไปยัง Google Drive)</p>
    </div>`;
  document.getElementById('removeFileBtn').classList.add('hidden');
}

/* =========================================================
   LOGO UPLOAD
========================================================= */
async function handleLogoUpload(e) {
  const f = e.target.files[0];
  if (!f) return;

  if (!['image/png', 'image/jpeg', 'image/jpg'].includes(f.type)) {
    Swal.fire({ icon: 'error', title: 'ไฟล์ไม่ถูกต้อง', text: 'รองรับเฉพาะ PNG และ JPG', confirmButtonColor: '#0C7C82' });
    e.target.value = '';
    return;
  }
  if (f.size > 5 * 1024 * 1024) {
    Swal.fire({ icon: 'error', title: 'ไฟล์ใหญ่เกินไป', text: 'กรุณาใช้รูปโลโก้ขนาดไม่เกิน 5 MB', confirmButtonColor: '#0C7C82' });
    e.target.value = '';
    return;
  }

  Swal.fire({
    title: 'กำลังอัปโหลดโลโก้...',
    html: `<div style="display:flex;justify-content:center;padding:8px 0;">${SPIN}</div>`,
    showConfirmButton: false,
    allowOutsideClick: false
  });

  const reader = new FileReader();
  reader.onload = async ev => {
    let logoObj = { data: ev.target.result, name: f.name, type: f.type, size: f.size };
    if (GAS_API_URL) {
      const driveFile = await uploadFileToDrive(logoObj);
      DB.logo = driveFile.data;
    } else {
      DB.logo = ev.target.result;
    }

    if (!(await save())) { Swal.close(); return; }
    Swal.close();
    renderLogo();
    if (currentView.type === 'home') renderHome();
    toast('success', 'อัปเดตโลโก้เรียบร้อย');
  };
  reader.onerror = () => {
    Swal.close();
    Swal.fire({ icon: 'error', title: 'อัปโหลดไม่สำเร็จ', confirmButtonColor: '#0C7C82' });
  };
  reader.readAsDataURL(f);
  e.target.value = '';
}

        <div class="bg-white rounded-3xl border border-dashed border-slate-200 py-12 text-center">
          <div class="w-14 h-14 mx-auto rounded-2xl bg-slate-100 text-slate-300 flex items-center justify-center mb-3">
            ${icon('doc', 'w-6 h-6')}
          </div>
          <p class="text-[13px] text-slate-400 font-medium">ไม่มีไฟล์แนบสำหรับรายการนี้</p>
        </div>`}
    </div>`;

  showViewer();
}

/* =========================================================
   KEYBOARD
========================================================= */
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (!viewer.classList.contains('hidden')) closeViewer();
    else if (!document.getElementById('modal').classList.contains('hidden')) closeModal();
    else closeSidebar();
  }
});

/* =========================================================
   INIT
========================================================= */
(function init() {
  renderAuth();
  renderMenu();
  renderMobileNav();
  showSkeleton();
  syncFromCloud();
  setTimeout(renderHome, 350);
})();
</script>
</body>
